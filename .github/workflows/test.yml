name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type-check (incl. inference assertions in *.test-d.ts)
      run: npm run typecheck

    - name: Lint
      run: npm run lint

    - name: Check formatting
      run: npm run format:check

    - name: Build project
      run: npm run build

    - name: Check package exports and types (publint + attw)
      run: npm run check:exports
      if: matrix.node-version == '20.x'

    - name: Run tests with coverage (fails below 100%)
      run: npm run test:coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: matrix.node-version == '20.x'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage/lcov.info

  wire:
    runs-on: ubuntu-latest
    # Wire changes are often deliberate; divergences show as a warning and in the job summary.
    continue-on-error: true

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js 22.x
      uses: actions/setup-node@v5
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Compare the wire format against the latest published release
      run: npm run fuzz:diff -- --seed ${{ github.run_number }} --runs 10000
